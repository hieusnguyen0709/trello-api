name: CI - trello-api

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Build
        run: yarn build
  test-docker-build:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t trello-api:test .

      - name: Run container
        run: |
          docker run -d -p 8017:8017 --name trello-test trello-api:test

      - name: Check container is running
        run: |
          docker ps -a

      - name: Wait for app to start (retry)
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:8017; then
              echo "✅ API is up"
              exit 0
            fi
            echo "⏳ Waiting for API..."
            sleep 3
          done
          echo "❌ API failed to start"
          docker logs trello-test
          exit 1

      - name: Stop container
        if: always()
        run: docker stop trello-test