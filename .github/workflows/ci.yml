name: CI - trello-api

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Build
        run: yarn build
  test-docker-build:
    needs: build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: trello-api:test

      - name: Wait for MongoDB to be ready
        run: |
          for i in {1..15}; do
            if docker run --rm --network host mongo:6 mongosh --eval "db.adminCommand('ping')" mongodb://localhost:27017 > /dev/null 2>&1; then
              echo "MongoDB is ready!"
              exit 0
            fi
            echo "Waiting for MongoDB... ($i)"
            sleep 2
          done
          echo "MongoDB did not respond in time"
          exit 1
          
      - name: Run container
        run: |
          docker run -d \
            --name trello-api-test \
            --network host \
            -e MONGODB_URI=mongodb://localhost:27017 \
            -e DATABASE_NAME=trello_test_db \
            -e BUILD_MODE=production \
            -e PORT=8017 \
            -e AUTHOR=trello-api-ci \
            trello-api:test

      - name: Wait for server to be ready
        run: |
          for i in {1..15}; do
            if curl -sf http://localhost:8017/ > /dev/null; then
              echo "Server is up!"
              exit 0
            fi
            echo "Waiting for server... ($i)"
            sleep 2
          done
          echo "Server did not respond in time"
          docker logs trello-api-test
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs trello-api-test

      - name: Stop container
        if: always()
        run: docker rm -f trello-api-test