name: CI - trello-api

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Build
        run: yarn build
        
  docker-build-and-push:
    needs: build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/master'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            trello-api:test
            ghcr.io/${{ github.repository }}:latest
            554392673060.dkr.ecr.us-east-1.amazonaws.com/trello-api:latest

      - name: Wait for MongoDB to be ready
        run: |
          for i in {1..15}; do
            if docker exec ${{ job.services.mongodb.id }} mongosh --eval "db.adminCommand('ping')" > /dev/null 2>&1; then
              echo "MongoDB is ready!"
              exit 0
            fi
            echo "Waiting for MongoDB... ($i)"
            sleep 2
          done
          echo "MongoDB did not respond in time"
          exit 1

      - name: Run container
        run: |
          docker run -d \
            --name trello-api-test \
            --network host \
            -e MONGODB_URI=mongodb://localhost:27017 \
            -e DATABASE_NAME=trello_test_db \
            -e BUILD_MODE=production \
            -e PORT=8017 \
            -e AUTHOR=HieuNM \
            trello-api:test

      - name: Wait for container to be healthy
        run: |
          for i in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' trello-api-test)
            echo "Health status: $status ($i)"
            if [ "$status" == "healthy" ]; then
              echo "Container is healthy!"
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy in time"
          exit 1

      - name: Show healthcheck log (on failure)
        if: failure()
        run: docker inspect --format='{{json .State.Health}}' trello-api-test | python3 -m json.tool

      - name: Show container logs (on failure)
        if: failure()
        run: docker logs trello-api-test

      - name: Stop container
        if: always()
        run: docker rm -f trello-api-test

      - name: Push image to GHCR
        if: github.ref == 'refs/heads/master'
        run: docker push ghcr.io/${{ github.repository }}:latest

      - name: Push image to Amazon ECR
        if: github.ref == 'refs/heads/master'
        run: docker push 554392673060.dkr.ecr.us-east-1.amazonaws.com/trello-api:latest

  deploy-to-ec2:
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker system prune -af
            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin 554392673060.dkr.ecr.us-east-1.amazonaws.com
            sudo docker pull 554392673060.dkr.ecr.us-east-1.amazonaws.com/trello-api:latest
            sudo docker stop trello-api || true
            sudo docker rm trello-api || true
            sudo docker run -d \
              --name trello-api \
              --network host \
              --env-file /home/ubuntu/.env \
              --restart unless-stopped \
              554392673060.dkr.ecr.us-east-1.amazonaws.com/trello-api:latest